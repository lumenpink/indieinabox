name: CI

on:
  push:
    branches: ["main", "develop"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "develop"]

# Cancel concurrent runs on the same branch (except main)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CI_IMAGE: codeberg.org/lumenpink/gost-ci-php:latest

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1 — Lint + Unit tests (Matrix PHP 8.2 → 8.4)
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: "PHP ${{ matrix.php }} — Tests & Lint"
    runs-on: ubuntu-latest
    container:
      image: ${{ env.CI_IMAGE }}
    strategy:
      fail-fast: true          # Stop at the first error in any version
      matrix:
        php: ["8.4"]

    steps:
      - name: "Checkout (full history for Psalm)"
        uses: https://github.com/actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: "Cache vendor & tools"
        id: cache-vendor
        uses: https://github.com/actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            vendor
            .phpcs-cache
            .psalm-cache
          key: vendor-php${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            vendor-php${{ matrix.php }}-

      - name: "Install Composer dependencies"
        if: steps.cache-vendor.outputs.cache-hit != 'true'
        run: composer install --no-interaction --prefer-dist --no-progress

      # ── Security ────────────────────────────────────────────────────────────
      - name: "composer audit — Known vulnerabilities"
        # Substitute for roave/security-advisories (conflicts with pest v3)
        run: composer audit --format=plain

      # ── PHP Version Compatibility ────────────────────────────────────────
      - name: "PHP Compatibility Sniffer (8.2 - 8.4)"
        run: |
          composer sniffer

      # ── Create dummy database config for tests ───────────────────────────
      - name: "Setup test database"
        run: |
          mkdir -p data
          echo "<?php return ['db_path' => __DIR__ . '/data/indieinabox.sqlite'];" > .config.php
          php -r '$db = new PDO("sqlite:" . __DIR__ . "/data/indieinabox.sqlite"); $db->exec(file_get_contents("database.sql"));'

      # ── Bundle compilation (required for test:compiled) ─────────────────
      - name: "Compile bundle (php compile.php)"
        run: php compile.php

      # ── PEST Tests ──────────────────────────────────────────────────────────
      - name: "PEST — Standard suite (source) + Clover coverage"
        env:
          XDEBUG_MODE: coverage
        run: |
          mkdir -p coverage
          ./vendor/bin/pest \
            --coverage-clover coverage/clover.xml \
            --coverage-html coverage/html \
            --log-junit coverage/junit.xml

      - name: "PEST — Compiled suite"
        run: |
          TEST_COMPILED=true ./vendor/bin/pest

      # ── Coverage summary & Pages deployment ──────────────────────────────
      - name: "Publish Test Summary"
        if: always() && matrix.php == '8.4'
        run: php scripts/generate_ci_summary.php --step-summary

      - name: "Deploy Coverage Dashboard to Pages"
        if: always() && matrix.php == '8.4' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          php scripts/generate_ci_summary.php --build-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin pages:pages 2>/dev/null || true
          if ! git rev-parse --verify pages >/dev/null 2>&1; then
            EMPTY_TREE=$(git hash-object -t tree /dev/null)
            FIRST_COMMIT=$(git commit-tree "$EMPTY_TREE" -m "Initialize pages branch")
            git branch pages "$FIRST_COMMIT"
          fi
          git worktree add /tmp/pages pages
          rm -rf /tmp/pages/*
          cp -r public_reports/* /tmp/pages/
          cd /tmp/pages
          git add -A
          git commit -m "Deploy CI reports dashboard - $(date -u '+%Y-%m-%dT%H:%M:%SZ')" || echo "No changes to commit"
          git push origin pages || git push -f origin pages


  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1.5 — Link Checker (built-in PHP)
  # ─────────────────────────────────────────────────────────────────────────────
  link-checker:
    name: "Check for 404s (PHP LinkChecker)"
    runs-on: ubuntu-latest
    container:
      image: ${{ env.CI_IMAGE }}

    steps:
      - name: "Checkout"
        uses: https://github.com/actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: "Cache vendor"
        id: cache-vendor
        uses: https://github.com/actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            vendor
          key: vendor-php8.4-${{ hashFiles('composer.lock') }}
          restore-keys: |
            vendor-php8.4-

      - name: "Install Composer dependencies"
        if: steps.cache-vendor.outputs.cache-hit != 'true'
        run: composer install --no-interaction --prefer-dist --no-progress --no-dev

      - name: "Setup test database"
        run: |
          mkdir -p data
          echo "<?php return ['db_path' => __DIR__ . '/data/indieinabox.sqlite'];" > .config.php
          php -r '$db = new PDO("sqlite:" . __DIR__ . "/data/indieinabox.sqlite"); $db->exec(file_get_contents("database.sql"));'

      - name: "Build Site"
        run: php build.php

      - name: "Check Links"
        run: |
          mkdir -p coverage
          php build.php test-links --skip-external --report coverage/link-check-report.json

      - name: "Publish Link Checker Summary"
        if: always()
        run: php scripts/generate_ci_summary.php --step-summary

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2 — Static security analysis with Psalm
  # ─────────────────────────────────────────────────────────────────────────────
  psalm:
    name: "Psalm — Static Security Analysis"
    runs-on: ubuntu-latest
    container:
      image: ${{ env.CI_IMAGE }}
    needs: test           # Only runs if tests pass

    steps:
      - uses: https://github.com/actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: "Cache vendor & tools"
        id: cache-vendor
        uses: https://github.com/actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            vendor
            .phpcs-cache
            .psalm-cache
          key: vendor-php8.4-${{ hashFiles('composer.lock') }}
          restore-keys: |
            vendor-php8.4-

      - name: "Install dependencies"
        run: |
          composer install --no-interaction --prefer-dist --no-progress

      - name: "Psalm — Analysis (taints + errors)"
        run: |
          mkdir -p coverage
          ./vendor/bin/psalm \
            --config=psalm.xml \
            --taint-analysis \
            --report=coverage/psalm.json \
            --report-show-info=true \
            --no-progress \
            --output-format=github   # Native PR annotations

      - name: "Publish Psalm Summary"
        if: always()
        run: php scripts/generate_ci_summary.php --step-summary

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3 — OWASP Dependency-Check (CVEs in transitive dependencies)
  # ─────────────────────────────────────────────────────────────────────────────
  dependency-check:
    name: "OWASP Dependency-Check"
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: https://github.com/actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: "Get week (NVD cache key)"
        id: week
        run: echo "week=$(date +%Y-%W)" >> $GITHUB_OUTPUT

      - name: "Cache NVD (speeds up subsequent scans)"
        uses: https://github.com/actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.dependency-check/data
          key: nvd-${{ steps.week.outputs.week }}
          restore-keys: |
            nvd-

      - name: "Run OWASP Dependency-Check"
        uses: https://github.com/dependency-check/Dependency-Check_Action@75ba02d6183445fe0761d26e836bde58b1560600 # v1.1.0
        id: depcheck
        with:
          project: "indieinabox"
          path: "."
          format: "HTML SARIF"
          out: "coverage/dependency-check"
          # CVSS >= 7 fails the build (adjust according to risk policy)
          args: >
            --failOnCVSS 7
            --enableRetired
            --exclude "**/vendor/**"



  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 4 — SonarQube / SonarCloud
  # Depends on previous jobs to have reports available
  # ─────────────────────────────────────────────────────────────────────────────
  sonarqube:
    name: "SonarQube Analysis"
    runs-on: ubuntu-latest
    needs: [test, psalm]      # Requires coverage and Psalm reports
    # Only runs on main branch or PRs (avoids running on feature branches without SONAR_TOKEN)
    if: github.actor != 'dependabot[bot]'
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: "Verify SONAR_TOKEN"
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::warning::SONAR_TOKEN not configured. Skipping SonarQube analysis."
          fi

      - uses: https://github.com/actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        if: env.SONAR_TOKEN != ''
        with:
          fetch-depth: 0   # Required for blame and history in Sonar

      - name: "Restore reports from Pages branch (if available)"
        if: env.SONAR_TOKEN != ''
        run: |
          mkdir -p coverage
          git fetch origin pages:pages 2>/dev/null || true
          git show pages:coverage/clover.xml > coverage/clover.xml 2>/dev/null || true
          [ -s coverage/clover.xml ] || rm -f coverage/clover.xml

      # ── Option A: SonarCloud (Free SaaS for open source) ─────────────────
      - name: "SonarCloud Scan"
        if: env.SONAR_TOKEN != ''
        uses: https://github.com/SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v8.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY || 'lumenpink_indieinabox' }}
            -Dsonar.organization=${{ vars.SONAR_ORG || 'lumenpink' }}
            -Dsonar.php.coverage.reportPaths=coverage/clover.xml

      # ── Option B: SonarQube ubuntu-latest (uncomment if preferred) ──────────────
      # - name: "SonarQube Scan (ubuntu-latest)"
      #   if: env.SONAR_TOKEN != ''
      #   uses: https://github.com/SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v8.2.0
      #   env:
      #     SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 5 — Nightly Release (only on main branch after tests pass)
  # ─────────────────────────────────────────────────────────────────────────────
  nightly-release:
    name: "Nightly Release"
    runs-on: ubuntu-latest
    container:
      image: ${{ env.CI_IMAGE }}
    needs: [test, psalm]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-dev

      - name: "Determine Version"
        id: version
        run: |
          VERSION=$(php -r "require 'app/Core/Version.php'; echo Indieinabox\Core\Version::get();")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Compile App
        run: php compile.php

      - name: "Delete Nightly Git Tag and Release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_URL: ${{ env.GITHUB_API_URL || 'https://codeberg.org/api/v1' }}
          REPO: ${{ github.repository }}
        run: |
          # Delete remote git tag — forces softprops to CREATE (not UPDATE) the release,
          # guaranteeing a fresh created_at timestamp.
          git push --delete origin nightly 2>/dev/null \
            && echo "Remote nightly tag deleted" \
            || echo "Remote nightly tag not found (first run?)"

          # Delete the existing nightly release via API
          REL_ID=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "$API_URL/repos/$REPO/releases/tags/nightly" | php -r '$d = json_decode(file_get_contents("php://stdin"), true); echo $d["id"] ?? "";')
          if [ -n "$REL_ID" ] && [ "$REL_ID" != "null" ]; then
            echo "Deleting nightly release ID: $REL_ID"
            if curl -sf -X DELETE -H "Authorization: token $GITHUB_TOKEN" \
              "$API_URL/repos/$REPO/releases/$REL_ID"; then
              echo "Release deleted successfully"
            else
              echo "Warning: Failed to delete release $REL_ID" >&2
            fi
          else
            echo "No existing nightly release found"
          fi

      - name: "Create Annotated Nightly Tag"
        run: |
          # Annotated tags carry a tagger date (= now), unlike lightweight tags
          # which use the commit date. This ensures Forgejo sorts 'nightly' as
          # the most recently tagged, regardless of when the HEAD commit was made.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -d nightly 2>/dev/null || true
          git tag -a nightly -m "Nightly build - $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          git push origin nightly

      - name: "Create Nightly Release"
        uses: https://github.com/softprops/action-gh-release@v2
        with:
          tag_name: "nightly"
          name: "Nightly Build (${{ steps.version.outputs.version }})"
          prerelease: true
          files: indieinabox.php
          body: |
            Automatic nightly build from main.

            Version: ${{ steps.version.outputs.version }}
            Commit: ${{ github.sha }}

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 6 — Stable Release (only on tags after tests pass)
  # ─────────────────────────────────────────────────────────────────────────────
  stable-release:
    name: "Stable Release"
    runs-on: ubuntu-latest
    container:
      image: ${{ env.CI_IMAGE }}
    needs: [test, psalm]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-dev

      - name: "Determine Version"
        id: version
        run: |
          VERSION=$(php -r "require 'app/Core/Version.php'; echo Indieinabox\Core\Version::get();")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Compile App
        run: php compile.php

      - name: Create Stable Release
        uses: https://github.com/softprops/action-gh-release@v2
        with:
          name: "Release ${{ steps.version.outputs.version }}"
          prerelease: false
          files: indieinabox.php
          body: |
            IndieInABox Release ${{ steps.version.outputs.version }}

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 7 — Deploy Documentation Site to Cloudflare Workers (indieinabox.2lp.in)
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-site:
    name: "Deploy Documentation Site (indieinabox.2lp.in)"
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: https://github.com/actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare Site Assets
        run: |
          mkdir -p site
          head -n 1 VERSION | tr -d ' \r\n' > site/version
          if [ -f indieinabox.php ]; then
            cp indieinabox.php site/indieinabox.php
          fi

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Cloudflare credentials (CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID) not configured in repository secrets. Skipping Cloudflare deployment."
          else
            echo "Publishing documentation site via Cloudflare Workers..."
            npx wrangler deploy
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB — Container Build, Push & Sovereign CD (obitwo)
  # ─────────────────────────────────────────────────────────────────────────────
  build-and-deploy-docker:
    name: "Container — Build & Sovereign CD (obitwo)"
    runs-on: ubuntu-latest
    needs: [test]
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.event_name == 'push'
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME || 'lumenpink' }}/indieinabox
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Log in to Docker Hub"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: "Extract metadata (tags, labels) for Docker"
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=ref,event=tag

      - name: "Build and push Docker image"
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: "Deploy Remotely to obitwo (Tailscale / SSH)"
        env:
          OBITWO_SSH_HOST: ${{ secrets.OBITWO_SSH_HOST || '100.90.43.39' }}
          OBITWO_SSH_USER: ${{ secrets.OBITWO_SSH_USER || 'ubuntu' }}
          OBITWO_SSH_KEY: ${{ secrets.OBITWO_SSH_KEY }}
        run: |
          echo "-> Iniciando deploy soberano no nó de borda obitwo ($OBITWO_SSH_HOST)..."
          if [ -f ~/.ssh/id_obitwo ]; then
            SSH_OPTS="-i ~/.ssh/id_obitwo -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15"
          elif [ -f ~/.ssh/id_ed25519 ]; then
            SSH_OPTS="-i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15"
          elif [ -n "$OBITWO_SSH_KEY" ]; then
            mkdir -p ~/.ssh && chmod 700 ~/.ssh
            echo "$OBITWO_SSH_KEY" > /tmp/id_ci_obitwo
            chmod 600 /tmp/id_ci_obitwo
            SSH_OPTS="-i /tmp/id_ci_obitwo -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15"
          else
            SSH_OPTS="-o StrictHostKeyChecking=accept-new -o ConnectTimeout=15"
          fi

          ssh $SSH_OPTS "$OBITWO_SSH_USER@$OBITWO_SSH_HOST" "
            set -eo pipefail
            cd ~/stacks/blog
            OLD_IMAGE_ID=\$(docker inspect --format='{{.Id}}' lumenpink/indieinabox:latest 2>/dev/null || true)
            echo \"OLD_IMAGE_ID=\$OLD_IMAGE_ID\"

            echo '-> Puxando nova imagem lumenpink/indieinabox:latest no obitwo...'
            docker compose pull web cron
            docker compose up -d --no-build web cron

            echo '-> Validando estabilidade (healthcheck polling 15s)...'
            SUCCESS=0
            for i in \$(seq 1 15); do
              STATUS=\$(docker inspect --format='{{.State.Status}}' indieinabox_web 2>/dev/null || echo 'unknown')
              if [ \"\$STATUS\" = 'running' ]; then
                echo \"  [PASS] Container indieinabox_web saudável e ativo (tentativa \$i/15).\"
                SUCCESS=1
                break
              fi
              sleep 1
            done

            if [ \$SUCCESS -ne 1 ]; then
              echo '✘ [FALHA] Container indieinabox_web não estabilizou no obitwo! Acionando Rollback...'
              if [ -n \"\$OLD_IMAGE_ID\" ]; then
                docker tag \"\$OLD_IMAGE_ID\" lumenpink/indieinabox:latest
                docker compose up -d --no-build web cron
                echo '✔ Rollback concluído no obitwo.'
              fi
              exit 1
            fi

            echo '-> Limpando camadas órfãs no obitwo...'
            docker image prune -f
          "

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB — Deploy Public Demo Instance
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-demo:
    name: "Build & Deploy Public Demo Instance"
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Set up PHP 8.4"
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, mbstring, intl, gd, zip, curl, gmp

      - name: "Install Composer dependencies (production)"
        run: composer install --no-interaction --prefer-dist --no-dev --no-progress

      - name: "Build single-file executable (php compile.php)"
        run: |
          php compile.php
          test -f indieinabox.php && php -l indieinabox.php

      - name: "Build Docker Demo Image"
        run: |
          docker build -t indieinabox-demo:latest -f docker/Dockerfile .

      - name: "Automated Sandbox Seeding & Rollback Verification"
        run: |
          php indieinabox.php demo seed --fqdn "https://demo.indieinabox.2lp.in" --password "demo123"
          php indieinabox.php demo status
          php indieinabox.php demo reset

      - name: "Health check confirmation"
        run: |
          php -r '
            require_once "app/Core/Version.php";
            echo "Indieinabox Version: " . \Indieinabox\Core\Version::get() . "\n";
            $db = new PDO("sqlite:" . __DIR__ . "/data/indieinabox.sqlite");
            $res = $db->query("SELECT 1")->fetchColumn();
            if ($res !== 1 && $res !== "1") {
              echo "Database health check failed\n";
              exit(1);
            }
            echo "Database and environment healthy!\n";
          '

      - name: "Deploy to Demo Server"
        if: ${{ env.DEMO_SSH_HOST != '' }}
        env:
          DEMO_SSH_HOST: ${{ secrets.DEMO_SSH_HOST }}
          DEMO_SSH_KEY: ${{ secrets.DEMO_SSH_KEY }}
          DEMO_DEPLOY_PATH: ${{ secrets.DEMO_DEPLOY_PATH || '/var/www/indieinabox-demo' }}
        run: |
          echo "Deploying release bundle and seeded content to public demo server at $DEMO_SSH_HOST..."



