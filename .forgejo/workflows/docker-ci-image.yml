name: Build & Push CI Image

on:
  push:
    branches: ["main"]
    paths:
      - "docker/Dockerfile.ci"
  workflow_dispatch:   # Manual trigger (useful for the first push)

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Build the lightweight PHP CI image and push to Docker Hub.
  # Tagged as :latest and :php8.4 so ci.yml can reference a stable tag.
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: "Build & Push PHP CI image"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Log in to Docker Hub
        uses: https://github.com/docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: https://github.com/docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          file: docker/Dockerfile.ci
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/indieinabox-ci:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/indieinabox-ci:php8.4
