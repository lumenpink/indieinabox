name: Docker Publish

on:
  push:
    branches: ["main"]
    tags: ["v*"]

env:
  # Define your Docker Hub repository here (e.g., username/repo)
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/indieinabox

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=ref,event=tag

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Deploy Remotely to obitwo (Tailscale / SSH)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          OBITWO_SSH_HOST: ${{ secrets.OBITWO_SSH_HOST || '100.90.43.39' }}
          OBITWO_SSH_USER: ${{ secrets.OBITWO_SSH_USER || 'ubuntu' }}
          OBITWO_SSH_KEY: ${{ secrets.OBITWO_SSH_KEY }}
        run: |
          echo "-> Iniciando deploy soberano no nó de borda obitwo ($OBITWO_SSH_HOST)..."
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          if [ -n "$OBITWO_SSH_KEY" ]; then
            echo "$OBITWO_SSH_KEY" > ~/.ssh/id_obitwo
            chmod 600 ~/.ssh/id_obitwo
            SSH_OPTS="-i ~/.ssh/id_obitwo -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15"
          elif [ -f ~/.ssh/id_obitwo ]; then
            SSH_OPTS="-i ~/.ssh/id_obitwo -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15"
          elif [ -f ~/.ssh/id_ed25519 ]; then
            SSH_OPTS="-i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15"
          else
            SSH_OPTS="-o StrictHostKeyChecking=accept-new -o ConnectTimeout=15"
          fi

          ssh $SSH_OPTS "$OBITWO_SSH_USER@$OBITWO_SSH_HOST" "
            set -eo pipefail
            cd ~/stacks/blog
            OLD_IMAGE_ID=\$(docker inspect --format='{{.Id}}' lumenpink/indieinabox:latest 2>/dev/null || true)
            echo \"OLD_IMAGE_ID=\$OLD_IMAGE_ID\"

            echo '-> Puxando nova imagem lumenpink/indieinabox:latest no obitwo...'
            docker compose pull web cron
            docker compose up -d --no-build web cron

            echo '-> Validando estabilidade (healthcheck polling 15s)...'
            SUCCESS=0
            for i in \$(seq 1 15); do
              STATUS=\$(docker inspect --format='{{.State.Status}}' indieinabox_web 2>/dev/null || echo 'unknown')
              if [ \"\$STATUS\" = 'running' ]; then
                echo \"  [PASS] Container indieinabox_web saudável e ativo (tentativa \$i/15).\"
                SUCCESS=1
                break
              fi
              sleep 1
            done

            if [ \$SUCCESS -ne 1 ]; then
              echo '✘ [FALHA] Container indieinabox_web não estabilizou no obitwo! Acionando Rollback...'
              if [ -n \"\$OLD_IMAGE_ID\" ]; then
                docker tag \"\$OLD_IMAGE_ID\" lumenpink/indieinabox:latest
                docker compose up -d --no-build web cron
                echo '✔ Rollback concluído no obitwo.'
              fi
              exit 1
            fi

            echo '-> Limpando camadas órfãs no obitwo...'
            docker image prune -f
          "
