services:
  web:
    image: ghcr.io/seu-usuario/indieinabox:latest
    container_name: indieinabox_web
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      - APP_DOMAIN=${APP_DOMAIN:-localhost}
      # A imagem base já possui variáveis de ambiente para configuração do frankenphp
    volumes:
      - ./data:/app
    depends_on:
      - cron

  cron:
    image: ghcr.io/seu-usuario/indieinabox:latest
    container_name: indieinabox_cron
    restart: unless-stopped
    command: ["cron"] # Aciona a lógica de cron no entrypoint
    volumes:
      - ./data:/app

  gemini:
    image: makkes/agate:latest
    container_name: indieinabox_gemini
    restart: unless-stopped
    ports:
      - "${GEMINI_PORT:-1965}:1965"
    volumes:
      # Montamos apenas a pasta public_gemini do volume compartilhado
      - ./data:/app
    command: ["--content", "/app/public_gemini", "--hostname", "${APP_DOMAIN:-localhost}"]
    # Nota: Agate precisa de certificados TLS. Dependendo de como você expõe, 
    # pode ser necessário mapear certificados ou usar um proxy gemini.

  gopher:
    image: jaymoulin/gophernicus
    container_name: indieinabox_gopher
    restart: unless-stopped
    ports:
      - "${GOPHER_PORT:-70}:70"
    volumes:
      # Montamos apenas a pasta public_gopher do volume compartilhado
      - ./data:/app
    command: ["-h", "${APP_DOMAIN:-localhost}", "-r", "/app/public_gopher"]
