<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indie in a Box - All-in-One IndieWeb, Fediverse & Twtxt Engine</title>
    <meta http-equiv="refresh" content="0; url=en/">
    <link rel="canonical" href="https://indieinabox.2lp.in/en/">
    <link rel="alternate" hreflang="en" href="https://indieinabox.2lp.in/en/">
    <link rel="alternate" hreflang="pt" href="https://indieinabox.2lp.in/pt/">
    <link rel="alternate" hreflang="es" href="https://indieinabox.2lp.in/es/">
    <link rel="alternate" hreflang="fr" href="https://indieinabox.2lp.in/fr/">
    <link rel="alternate" hreflang="de" href="https://indieinabox.2lp.in/de/">
    <link rel="alternate" hreflang="zh" href="https://indieinabox.2lp.in/zh/">
    <link rel="alternate" hreflang="ja" href="https://indieinabox.2lp.in/ja/">
    <link rel="alternate" hreflang="ar" href="https://indieinabox.2lp.in/ar/">
    <script>
        (function() {
            var supported = ['en', 'pt', 'es', 'fr', 'de', 'zh', 'ja', 'ar'];
            var saved = localStorage.getItem('doc_lang');
            if (saved && supported.indexOf(saved) !== -1) {
                window.location.replace(saved + '/');
                return;
            }
            var navLang = (navigator.language || navigator.userLanguage || 'en').toLowerCase().substring(0, 2);
            if (supported.indexOf(navLang) !== -1) {
                window.location.replace(navLang + '/');
            } else {
                window.location.replace('en/');
            }
        })();
    </script>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='0' fill='%23141518'/><rect x='10' y='10' width='80' height='80' fill='%23ffe600'/><circle cx='50' cy='50' r='24' fill='%23ff007f'/></svg>">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem;">
    <div style="background: var(--lambe-surface); border: 3px solid #000; box-shadow: 6px 6px 0 #000; padding: 2.5rem; max-width: 600px; text-align: center;">
        <h1 style="font-family: 'Bebas Neue', 'Archivo Black', sans-serif; font-size: 2.5rem; margin: 0 0 1rem; color: var(--lambe-paper);">Indie in a Box</h1>
        <p style="color: var(--text-muted); margin-bottom: 2rem;">Redirecting to localized documentation...</p>
        <div style="display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;">
            <a href="en/" class="btn-cyber btn-cyber-primary" style="font-size: 0.8rem; padding: 6px 12px;">English</a>
            <a href="pt/" class="btn-cyber btn-cyber-secondary" style="font-size: 0.8rem; padding: 6px 12px;">Português</a>
            <a href="es/" class="btn-cyber btn-cyber-ghost" style="font-size: 0.8rem; padding: 6px 12px;">Español</a>
            <a href="fr/" class="btn-cyber btn-cyber-ghost" style="font-size: 0.8rem; padding: 6px 12px;">Français</a>
            <a href="de/" class="btn-cyber btn-cyber-ghost" style="font-size: 0.8rem; padding: 6px 12px;">Deutsch</a>
            <a href="zh/" class="btn-cyber btn-cyber-ghost" style="font-size: 0.8rem; padding: 6px 12px;">中文</a>
            <a href="ja/" class="btn-cyber btn-cyber-ghost" style="font-size: 0.8rem; padding: 6px 12px;">日本語</a>
            <a href="ar/" class="btn-cyber btn-cyber-ghost" style="font-size: 0.8rem; padding: 6px 12px;">العربية</a>
        </div>
    </div>
</body>
</html>
