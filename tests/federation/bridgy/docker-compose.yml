services:
  caddy:
    image: caddy:alpine
    container_name: bridgy_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    networks:
      default:
        aliases:
          - bridgy.local
          - indieinabox.local

  indieinabox:
    image: lumenpink/indieinabox:latest
    container_name: bridgy_indieinabox
    restart: unless-stopped
    environment:
      - APP_DOMAIN=https://indieinabox.local
    volumes:
      - ./data/indieinabox:/app

  bridgy-mock:
    image: php:8.4-cli-alpine
    container_name: bridgy_mock
    restart: unless-stopped
    command: php -S 0.0.0.0:8080 -t /var/www
    volumes:
      - ./mock_bridgy.php:/var/www/index.php

volumes:
  caddy_data:
