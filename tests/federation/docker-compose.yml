services:
  caddy-proxy:
    image: caddy:alpine
    container_name: federation_caddy
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
    environment:
      - MASTODON_DOMAIN=${MASTODON_DOMAIN}
      - MISSKEY_DOMAIN=${MISSKEY_DOMAIN}
      - PIXELFED_DOMAIN=${PIXELFED_DOMAIN}
      - INDIEINABOX_DOMAIN=${INDIEINABOX_DOMAIN}

  indieinabox-app:
    image: lumenpink/indieinabox:latest
    container_name: federation_indieinabox
    environment:
      - APP_DOMAIN=http://${INDIEINABOX_DOMAIN}:80
    volumes:
      - ../../data:/app

  # ==========================================
  # SHARED DATABASES (Otimização de RAM)
  # ==========================================
  federation-db:
    image: postgres:15-alpine
    container_name: federation_db
    environment:
      - POSTGRES_PASSWORD=root_pass
    volumes:
      - ../../data/federation_db:/var/lib/postgresql/data
      - ./init-dbs.sql:/docker-entrypoint-initdb.d/init.sql

  federation-redis:
    image: redis:7-alpine
    container_name: federation_redis
    volumes:
      - ../../data/federation_redis:/data

  # ==========================================
  # MASTODON (Usa Postgres DB 'mastodon' e Redis DB 0)
  # ==========================================
  mastodon-web:
    image: ghcr.io/mastodon/mastodon:v4.2.8
    container_name: mastodon_web
    restart: unless-stopped
    depends_on:
      - federation-db
      - federation-redis
    environment:
      - LOCAL_DOMAIN=${MASTODON_DOMAIN}
      - REDIS_URL=redis://federation-redis:6379/0
      - DB_HOST=federation-db
      - DB_USER=mastodon
      - DB_NAME=mastodon
      - DB_PASS=mastodon_pass
      - DB_PORT=5432
      - SECRET_KEY_BASE=dummy_secret_for_testing_only
      - OTP_SECRET=dummy_otp_secret_for_testing_only
      - VAPID_PRIVATE_KEY=
      - VAPID_PUBLIC_KEY=
    command: bash -c "rm -f /mastodon/tmp/pids/server.pid; bundle exec rails db:prepare || true; bundle exec rails s -p 3000"
    volumes:
      - ../../data/mastodon_public:/mastodon/public/system

  mastodon-sidekiq:
    image: ghcr.io/mastodon/mastodon:v4.2.8
    container_name: mastodon_sidekiq
    restart: unless-stopped
    depends_on:
      - federation-db
      - federation-redis
    environment:
      - LOCAL_DOMAIN=${MASTODON_DOMAIN}
      - REDIS_URL=redis://federation-redis:6379/0
      - DB_HOST=federation-db
      - DB_USER=mastodon
      - DB_NAME=mastodon
      - DB_PASS=mastodon_pass
      - DB_PORT=5432
      - SECRET_KEY_BASE=dummy_secret_for_testing_only
      - OTP_SECRET=dummy_otp_secret_for_testing_only
    command: bundle exec sidekiq
    volumes:
      - ../../data/mastodon_public:/mastodon/public/system

  # ==========================================
  # MISSKEY (Usa Postgres DB 'misskey' e Redis DB 1)
  # ==========================================
  misskey-web:
    image: misskey/misskey:latest
    container_name: misskey_web
    depends_on:
      - federation-db
      - federation-redis
    environment:
      - MISSKEY_DOMAIN=${MISSKEY_DOMAIN}
    command: sh -c "mkdir -p /misskey/.config && sed \"s/\\$${MISSKEY_DOMAIN}/$MISSKEY_DOMAIN/g\" /misskey/template.yml > /misskey/.config/default.yml && pnpm run migrate && pnpm run start"
    volumes:
      - ./misskey/template.yml:/misskey/template.yml
      - ../../data/misskey_files:/misskey/files

  # ==========================================
  # PIXELFED (Usa Postgres DB 'pixelfed' e Redis DB 2)
  # ==========================================
  pixelfed-web:
    image: ghcr.io/pixelfed/pixelfed:latest
    container_name: pixelfed_web
    depends_on:
      - federation-db
      - federation-redis
    environment:
      - APP_NAME=PixelfedLocal
      - APP_ENV=production
      - APP_KEY=base64:RRjoo5T0EywRLsGh7LENJQ3MsI0NU7tlkkMn4j/wmiI=
      - APP_DEBUG=false
      - APP_URL=https://${PIXELFED_DOMAIN}
      - DB_CONNECTION=pgsql
      - DB_HOST=federation-db
      - DB_PORT=5432
      - DB_DATABASE=pixelfed
      - DB_USERNAME=pixelfed
      - DB_PASSWORD=pixelfed_pass
      - REDIS_HOST=federation-redis
      - REDIS_DATABASE=2
      - REDIS_PASSWORD=null
      - REDIS_PORT=6379
      - BROADCAST_DRIVER=redis
      - CACHE_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - SESSION_DRIVER=redis
    volumes:
      - ../../data/pixelfed_app:/var/www/


