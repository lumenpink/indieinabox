services:
  caddy:
    image: caddy:alpine
    container_name: misskey_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    networks:
      default:
        aliases:
          - misskey.local
          - indieinabox.local

  indieinabox:
    image: lumenpink/indieinabox:latest
    container_name: misskey_indieinabox
    restart: unless-stopped
    environment:
      - APP_DOMAIN=https://indieinabox.local
    volumes:
      - ./data/indieinabox:/app

  postgres:
    image: postgres:15-alpine
    container_name: misskey_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=misskey
      - POSTGRES_USER=misskey
      - POSTGRES_PASSWORD=misskey_pass
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: misskey_redis
    restart: unless-stopped
    volumes:
      - ./data/redis:/data

  misskey-web:
    image: misskey/misskey:2026.9.0
    container_name: misskey_web
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      - MISSKEY_DOMAIN=misskey.local
      - NODE_EXTRA_CA_CERTS=/caddy-data/caddy/pki/authorities/local/root.crt
    command: sh -c "mkdir -p /misskey/.config && sed 's/\\$${MISSKEY_DOMAIN}/misskey.local/g' /misskey/template.yml > /misskey/.config/default.yml && pnpm run migrate && pnpm run start"
    volumes:
      - ./template.yml:/misskey/template.yml
      - ./data/files:/misskey/files
      - caddy_data:/caddy-data

volumes:
  caddy_data:
